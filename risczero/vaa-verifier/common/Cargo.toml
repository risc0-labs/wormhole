[package]
name = "common"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = { version = "1.3" }
serde = { version = "1.0.215", features = ["derive"] }
byteorder = "1.5.0"
sha3 = "0.10.8"
alloy = { version = "0.12.6", features = ["signers", "k256", "serde", "sol-types"], default-features = false }
thiserror = "2.0.12"
alloy-sol-types = "0.8.24"
