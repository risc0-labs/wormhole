[package]
name = "methods"
version = "0.1.0"
edition = "2021"

[build-dependencies]
risc0-build = { version = "1.2" }
risc0-build-ethereum = { git = "https://github.com/risc0/risc0-ethereum", rev = "v1.2.0" }

[dependencies]
alloy-sol-types = "0.8.24"

[dev-dependencies]
alloy-primitives = "0.8.24"
hex-literal = "1.0.0"
risc0-zkvm = { git = "https://github.com/risc0/risc0", rev = "v1.2.0", features = ["client", "unstable"] }
common = { path = "../common" }

[package.metadata.risc0]
methods = ["guest"]
